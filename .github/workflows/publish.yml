name: Publish GGC corporate site
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Reviewed ggc-global commit SHA"
        required: true
        default: "67478e3cb9b65a980e1d027d299e6c5d6ebfa6ab"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ggc-corporate-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out publishing safeguards
        uses: actions/checkout@v4
        with:
          path: publisher
      - name: Check out reviewed source
        uses: actions/checkout@v4
        with:
          repository: minyajing-rgb/ggc-global
          ref: ${{ inputs.source_ref }}
          path: source
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build verified bilingual site
        run: python source/corporate/fullsite-v4/prepare_site.py --out "$GITHUB_WORKSPACE/site" --stage "$RUNNER_TEMP/ggc-site-source"
      - name: Prepare public entry points and remove review-only UI
        run: |
          python - <<'PY'
          from pathlib import Path
          site = Path('site')
          zh = '<a href="../review.html">整站UI总览 ↗</a>'
          en = '<a href="../review.html">All-screen review ↗</a>'
          removed = 0
          for page in site.glob('??/*.html'):
              html = page.read_text(encoding='utf-8')
              removed += html.count(zh) + html.count(en)
              page.write_text(html.replace(zh, '').replace(en, ''), encoding='utf-8')
          print(f'Removed {removed} review-only links')
          (site / 'review.html').unlink(missing_ok=True)
          (site / 'source-verification.json').unlink(missing_ok=True)
          (site / 'index.html').write_text(
              '<!doctype html><html lang="zh"><meta charset="utf-8">'
              '<meta http-equiv="refresh" content="0;url=zh/index.html">'
              '<title>GGC</title><a href="zh/index.html">进入 GGC 官网 / Enter GGC</a></html>',
              encoding='utf-8')
          (site / '404.html').write_text(
              '<!doctype html><html lang="zh"><meta charset="utf-8">'
              '<meta name="robots" content="noindex"><title>页面不存在 · GGC</title>'
              '<h1>页面不存在 / Page not found</h1>'
              '<p><a href="/">{REPLACE}</a></p></html>'.replace('{REPLACE}', '返回官网 / Back to GGC'),
              encoding='utf-8')
          (site / '.nojekyll').touch()
          for file in ('zh/index.html', 'en/index.html', 'assets/joyce-approved.webp'):
              assert (site / file).is_file(), file
          PY
      - name: Harden public forms, privacy, and mobile navigation
        run: python publisher/scripts/harden_site.py site
      - name: Finalize production SEO
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from xml.sax.saxutils import escape
          site = Path('site')
          origin = 'https://ggcgames.com'
          sitemap = []
          for page in sorted(site.glob('??/*.html')):
              locale = page.parent.name
              if locale not in ('zh', 'en'):
                  continue
              route = page.name
              indexable = route not in ('404.html', 'buttons.html')
              html = page.read_text(encoding='utf-8')
              html = re.sub(r'<meta[^>]*name="robots"[^>]*>', '', html, flags=re.I)
              robots = '<meta name="robots" content="' + ('index,follow' if indexable else 'noindex,follow') + '">'
              tags = robots
              if indexable and 'rel="canonical"' not in html:
                  canonical = f'{origin}/{locale}/{route}'
                  tags += f'<link rel="canonical" href="{canonical}">'
                  for lang, path_locale in (('zh-CN','zh'), ('en','en'), ('x-default','zh')):
                      tags += f'<link rel="alternate" hreflang="{lang}" href="{origin}/{path_locale}/{route}">'
              html = html.replace('</head>', tags + '</head>', 1)
              page.write_text(html, encoding='utf-8')
              if indexable:
                  sitemap.append(f'{origin}/{locale}/{route}')
          (site / 'robots.txt').write_text(chr(10).join(('User-agent: *', 'Allow: /', 'Sitemap: ' + origin + '/sitemap.xml', '')), encoding='utf-8')
          nl = chr(10)
          xml = nl.join(['<?xml version="1.0" encoding="UTF-8"?>', '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'] + [f'  <url><loc>{escape(url)}</loc></url>' for url in sitemap] + ['</urlset>', ''])
          (site / 'sitemap.xml').write_text(xml, encoding='utf-8')
          print(f'Production sitemap: {len(sitemap)} URLs')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
