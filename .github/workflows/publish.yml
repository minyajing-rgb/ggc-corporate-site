name: Publish GGC corporate site
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Reviewed ggc-global commit SHA"
        required: true
        default: "5d0f63a17f498fc28c0eb459f1ee3ae775282646"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ggc-corporate-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4
        with:
          repository: minyajing-rgb/ggc-global
          ref: ${{ inputs.source_ref }}
          path: source
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build source-owned P0 release artifact
        run: python source/corporate/fullsite-v4/build_ready.py --out "$GITHUB_WORKSPACE/site" --mode release --base-url https://ggcgames.com/ --google-form
      - name: Verify and minimize public artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          site = Path('site')
          report = json.loads((site / 'readiness-manifest.json').read_text())
          assert report['mode'] == 'release'
          assert report['canonical_base'] == 'https://ggcgames.com/'
          assert report['locale_pages'] == 98
          assert report['indexable_urls'] == 94
          assert report['approved_assets_unchanged']
          assert report['forms'].startswith('Google Forms business inquiries')
          assert report['google_form_url'].startswith('https://docs.google.com/forms/d/e/')
          for locale in ('zh', 'en'):
              contact = (site / locale / 'contact.html').read_text(encoding='utf-8')
              privacy = (site / locale / 'privacy.html').read_text(encoding='utf-8')
              assert contact.count(report['google_form_url']) == 1
              assert 'data-inquiry' not in contact and 'formsubmit.co' not in contact
              assert 'Google' in privacy
          assert len(list(site.glob('??/*.html'))) == 98
          for path in ('index.html', '404.html', 'robots.txt', 'sitemap.xml', 'assets/readiness.js'):
              assert (site / path).is_file(), path
          assert 'href="review.html"' not in (site / 'index.html').read_text(encoding='utf-8')
          for path in site.glob('??/*.html'):
              content = path.read_text(encoding='utf-8')
              assert '../review.html' not in content, path
          for path in ('review.html', 'source-verification.json', 'readiness-manifest.json', 'build-manifest.json'):
              (site / path).unlink(missing_ok=True)
          (site / '.nojekyll').touch()
          print('Verified release: 98 localized pages, 94 indexable URLs, 2 privacy pages, branded 404')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
